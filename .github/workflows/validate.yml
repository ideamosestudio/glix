name: Validate website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check security policy and local resources
        run: python3 scripts/check-site.py
      - name: Test safe cPanel deployment
        run: |
          python3 scripts/test-cpanel-deploy.py
          python3 scripts/test-cpanel-config.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check contact.js
      - name: Validate contact handler without sending mail
        run: |
          php -l api/glix-contact.php
          php server/test-contact.php
